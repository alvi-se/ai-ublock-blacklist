name: Generate uBlacklist filters

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create Ublock Origin list
        run: |
          python3 .github/scripts/ublock.py

      - name: Create ublacklist list
        run: |
          python3 .github/scripts/ublacklist.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ublacklist.txt list.txt
          git diff --cached --quiet || git commit -m "Auto-generate lists"
          git push
